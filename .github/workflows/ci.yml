name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:

  # Run all tests.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5  # v2.7.0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10  # v1.7.0
        with:
          version: stable

      - name: Install submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          forge install

      - name: Run forge tests and create gas report.
        run: |
          set -e
          forge test | tee output.txt
          test ${PIPESTATUS[0]} -eq 0
          sed -n -e '/^|/p' output.txt > gas.txt
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          FORGE_GAS_REPORT: true
          FOUNDRY_PROFILE: ${{ github.event_name == 'push' && 'ci' || '' }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gas-report
          path: gas.txt

  # Check contract sizes.
  size:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5  # v2.7.0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10  # v1.7.0
        with:
          version: stable

      - name: Install submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          forge install

      - name: Run contract size check
        run: |
          chmod +x ./scripts/size.sh
          ./scripts/size.sh
        env:
          FOUNDRY_PROFILE: ci

  # Check and generate code coverage report.
  coverage:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5  # v2.7.0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10  # v1.7.0
        with:
          version: stable

      - name: Install submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          forge install

      - name: Install lcov
        run: sudo apt-get install lcov

      - name: Generate code coverage report
        run: |
          forge coverage --report lcov
          lcov --remove ./lcov.info 'tests/*' -o ./lcov.info.pruned --rc lcov_branch_coverage=1
        env:
          FOUNDRY_PROFILE: ${{ github.event_name == 'push' && 'ci' || '' }}

      - name: Report code coverage
        uses: zgosalvez/github-actions-report-lcov@eda775f552bfb2bffbdedea26f19dfb8c24a1648  # v4.1.26
        with:
          coverage-files: lcov.info.pruned
          minimum-coverage: 90
          artifact-name: code-coverage-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ./
          update-comment: true

  # Post gas report.
  gas:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gas-report
          path: artifacts

      - uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
        with:
          message-path: artifacts/gas.txt
          preformatted: true
